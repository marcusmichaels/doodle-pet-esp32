; PlatformIO project configuration
; Docs: https://docs.platformio.org/page/projectconf.html
;
; Layout:
;   [env]            settings shared by every board
;   [e32r28t]        pin/driver config for the Elegoo 2.8" display board
;   [env:...]        buildable targets: pio run -e <name> -t upload
;
; To add another ESP32: add a new [env:<name>] with its own board/build_flags.

[platformio]
default_envs = e32r28t

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800  ; 921600 is unreliable with the CH340 USB-serial chip
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
; Elegoo / LCDwiki E32R28T: ESP32-WROOM-32E + 2.8" 240x320 TFT + XPT2046 touch
; TFT_eSPI is configured entirely here, so the library's User_Setup.h is ignored.
; ---------------------------------------------------------------------------
[e32r28t]
board = esp32dev
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; Display SPI
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    ; Backlight (active HIGH)
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; XPT2046 touch is on its own pins, bit-banged in src/main.cpp (IRQ on GPIO 36 unused)
    -DXPT_CLK=25
    -DXPT_MOSI=32
    -DXPT_MISO=39
    -DXPT_CS=33
    ; RGB LED, common anode (LOW lights it)
    -DLED_RED=22
    -DLED_GREEN=16
    -DLED_BLUE=17
    -DLED_ACTIVE_LOW=1
    ; Fonts
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; SPI speeds
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; Default: ILI9341 panel
[env:e32r28t]
extends = e32r28t
build_flags =
    ${e32r28t.build_flags}
    -DILI9341_DRIVER=1
    ; If colours look wrong, try adding:
    ; -DTFT_INVERSION_ON=1
    ; -DTFT_RGB_ORDER=TFT_BGR

; Newer board revisions with an ST7789P3 panel (use this if the screen stays white)
[env:e32r28t_st7789]
extends = e32r28t
build_flags =
    ${e32r28t.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_OFF=1
